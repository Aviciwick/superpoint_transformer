# @package _global_

defaults:
  - /experiment/semantic/toronto3d

trainer:
  precision: 32

model:
  bsr:
    enable: true
    selector:
      topk_ratio: 0.15
      score_terms: [uncertainty, geometry, boundary]
    refiner:
      n_sample: 64
      n_heads: 4
      token_mode: superpoint_query
      variant: mixture
      n_subregions: 2
      assignment_temperature: 1.0
      sampling_mode: coverage
      sampling_without_replacement: true
    loss:
      lambda_refine: 0.5
      lambda_consistency: 0.1
      lambda_diversity: 0.02
      lambda_boundary: 0.05
      global_weight: 0.5
      warmup_epochs: 10
      score_weighting: true
      score_weight_gamma: 1.0
    feedback:
      logit_fusion_alpha: 0.5
      warmup_epochs: 10
    propagation:
      mode: slot_all_points
      chunk_size: 200000
      store_slot_affinity: false
      dual_slot_threshold: 0.2
      metric_level: point

logger:
  wandb:
    name: "SPT-64-BSR-Toronto3D-intensity-wholeroad"
    group: "toronto3d/bsr"
    tags: ["semantic", "toronto3d", "spt", "spt64", "bsr", "intensity", "wholeroad"]
    job_type: "semantic_bsr"
