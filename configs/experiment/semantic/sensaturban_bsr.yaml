# @package _global_

defaults:
  - /experiment/semantic/sensaturban

trainer:
  gradient_clip_val: 1.0

model:
  bsr:
    enable: true
    selector:
      topk_ratio: 0.15
      score_terms: [uncertainty, geometry, boundary]
    refiner:
      n_sample: 64
      n_heads: 4
      token_mode: superpoint_query
      variant: mixture
      n_subregions: 2
      assignment_temperature: 1.0
      sampling_mode: coverage
      sampling_without_replacement: true
    loss:
      lambda_refine: 0.5
      lambda_consistency: 0.1
      lambda_diversity: 0.02
      lambda_boundary: 0.05
      global_weight: 0.5
      warmup_epochs: 10
      score_weighting: true
      score_weight_gamma: 1.0
    feedback:
      logit_fusion_alpha: 0.5
      warmup_epochs: 10

logger:
  wandb:
    project: "spt_sensaturban"
    name: "SPT-64-BSR-SensatUrban"
    group: "sensaturban/bsr"
    tags: ["semantic", "sensaturban", "spt", "spt64", "bsr", "rgb", "xy3"]
    job_type: "semantic_bsr"
